<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="products">
    <h1 class="products__section_title">Выбери свой продукт</h1>
    <div class="products__list">
      <template class="card1">
        <div class="card"> 
        <img src="" alt="Moisturizing mousse product preview">
        <h3 class="card__subheading"></h3>
        <h2 class="card__heading"></h2>
        <p class="card__description"></p>
        <h4 class="card__composition_heading">Состав:</h4>
        <ul class="card__composition_list"></ul>
        <div class="card__price_box">
          <b class="card__price_heading">Цена:</b>
          <span class="card__price_value"></span>
        </div>
        </div>
      </template>
    </div>
  </div>
  <div class="button_panel">
    <button class="button_panel__turnCardsPurple_buttton">Покрасить все карточки в фиолетовый</button>
    <button class="button_panel__turnFirstCardPink_buttton">Покрасить первую карточку в розовый</button>  
    <button class="button_panel__newTabGoogle_buttton">Открыть Google в новой вкладке</button>
    <button class="button_panel__invertButtonColor_buttton">Инвертировать цвет кнопки</button>  
  </div>
  <script type="module" src="./homework-9.js"></script>
  <script type="module" src="./homework-10.js"></script>
</body>
</html>
